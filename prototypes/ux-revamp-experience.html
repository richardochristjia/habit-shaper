    :root {
      --brand: #92400e;
      --brand-soft: #fff7dc;
      --action: #a94f08;
      --action-hover: #863d05;
      --accent: #047857;
      --accent-soft: #e3f5ed;
      --background: #fffbeb;
      --surface: #ffffff;
      --surface-soft: #fcf6f0;
      --foreground: #172033;
      --muted: #596274;
      --border: #d8c8b8;
      --input-border: #b9afa5;
      --destructive: #b91c1c;
      --destructive-soft: #fff1f2;
      --focus: #b45309;
      --shadow-overlay: 0 1.5rem 3.75rem rgb(88 57 30 / 0.22);
      --radius-field: .625rem;
      --radius-panel: 1rem;
      --radius-card: 1.25rem;
    }

    * { box-sizing: border-box; }
    html { color-scheme: light; scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100dvh;
      background: var(--background);
      color: var(--foreground);
      font: 500 16px/1.55 "Raleway Proto", Raleway, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font: inherit; }
    button, summary, select { cursor: pointer; }
    button, input, select { min-height: 44px; }
    button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }
    h1, h2, h3, h4, p { margin-top: 0; }
    h1, h2, h3, h4 { font-family: "Lora Proto", Lora, Georgia, serif; line-height: 1.15; letter-spacing: -.02em; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .icon { width: 20px; height: 20px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .icon-sm { width: 16px; height: 16px; }
    .muted { color: var(--muted); }
    .eyebrow { margin-bottom: 4px; color: var(--action); font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .button {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 44px; border: 1px solid transparent; border-radius: var(--radius-field);
      padding: 9px 15px; background: var(--surface); color: var(--foreground); font-weight: 750;
      text-decoration: none; transition: background-color 180ms, border-color 180ms, color 180ms, opacity 180ms;
    }
    .button:hover { border-color: var(--action); background: var(--surface-soft); }
    .button:active { background: var(--brand-soft); }
    .button.primary { border-color: var(--action); background: var(--action); color: white; box-shadow: 0 8px 18px rgb(169 79 8 / .16); }
    .button.primary:hover { background: var(--action-hover); }
    .button.secondary { border-color: var(--border); }

<body>
  <div id="app"></div>
  <script>
    "use strict";

    // PROTOTYPE QUESTION: Does the resolved Today interaction model remain understandable
    // when daily actions, corrections, Goals, creation, and empty states are driven together?
    const HabitModel = (() => {
      const TODAY = "2026-09-02";
      const WEEKDAY = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

      const clone = (value) => structuredClone(value);
      const parse = (iso) => new Date(`${iso}T12:00:00Z`);
      const iso = (date) => date.toISOString().slice(0, 10);
      const addDays = (value, amount) => { const d = parse(value); d.setUTCDate(d.getUTCDate() + amount); return iso(d); };
      const compare = (a, b) => a.localeCompare(b);
      const formatDate = (value, options = {}) => new Intl.DateTimeFormat("en-GB", { timeZone: "UTC", weekday: "long", day: "numeric", month: "long", year: "numeric", ...options }).format(parse(value));
      const mondayOf = (value) => { const day = parse(value).getUTCDay(); return addDays(value, -(day === 0 ? 6 : day - 1)); };
      const range = (start, end) => { const values = []; for (let day = start; compare(day, end) <= 0; day = addDays(day, 1)) values.push(day); return values; };
      const eligible = (habit, day) => compare(day, habit.startDate) >= 0 && compare(day, TODAY) <= 0;
      const isRecorded = (habit, day) => Boolean(habit.records[day]);

      function trackingState(habit, day) {
        if (compare(day, habit.startDate) < 0) return "ineligible";
        if (compare(day, TODAY) > 0) return "future";
        if (habit.type === "BUILD") {
          if (isRecorded(habit, day)) return "completion";
          return day === TODAY ? "pending" : "missed";
        }
        return isRecorded(habit, day) ? "relapse" : "clean";
      }

      function streak(habit) {
        if (habit.type === "BREAK") {
          let count = 0;
          for (let day = TODAY; eligible(habit, day); day = addDays(day, -1)) {
            if (isRecorded(habit, day)) break;
            count += 1;
          }
          return count;
        }
        let day = isRecorded(habit, TODAY) ? TODAY : addDays(TODAY, -1);
        let count = 0;
        while (eligible(habit, day) && isRecorded(habit, day)) { count += 1; day = addDays(day, -1); }
        return count;
      }

      function weekDays() {
        const monday = mondayOf(TODAY);
        return range(monday, addDays(monday, 6));
      }

      function weeklySummary(habit) {
        const states = weekDays().map((day) => trackingState(habit, day));
        const completed = states.filter((state) => state === "completion").length;
        const missed = states.filter((state) => state === "missed").length;
        const pending = states.filter((state) => state === "pending").length;
        const assessed = completed + missed;
        return { completed, missed, pending, assessed, rate: assessed ? Math.round(completed / assessed * 100) : null };
      }

      const records = (...days) => Object.fromEntries(days.map((day) => [day, true]));
      function populatedHabits() {
        return [
          { id: "build-read", name: "Read for 20 minutes", type: "BUILD", startDate: "2026-08-20", createdOrder: 1, goals: [{ id: "goal-book", name: "Finish one thoughtful book each month" }], records: records("2026-08-22", "2026-08-24", "2026-08-27", "2026-08-28", "2026-08-29", "2026-08-30", "2026-08-31", "2026-09-01") },

      function baseState(habits, preset) {
        return {
          today: TODAY,
          timeZone: "Europe/London",
          userEmail: "alex@example.com",
          habits,
          preset,
          drawer: null,
          creator: null,
          discardCreatorConfirm: false,
          deleteHabitConfirm: null,
          goalMenuId: null,
          addingGoal: false,
          renamingGoalId: null,
          deletingGoalId: null,
          pendingSaves: {},
          failNextSave: false,
          error: null,
          announcement: "",
          labOpen: true,
          guideScenario: "daily",
          lastChange: "Loaded the populated Today workspace.",
          idCounter: 100,
        };
      }

      function preset(name) {
        if (name === "empty") return baseState([], "empty");
        if (name === "build-only") return baseState(populatedHabits().filter((habit) => habit.type === "BUILD"), "build-only");
        return baseState(populatedHabits(), "populated");
      }

      const findHabit = (state, id) => state.habits.find((habit) => habit.id === id);

      function reducer(current, action) {
        if (action.type === "LOAD_PRESET") {
          const next = preset(action.preset);
          next.labOpen = current.labOpen;
          next.guideScenario = current.guideScenario;
          next.lastChange = action.message || `Loaded the ${action.preset} Today state.`;
          return next;
        }
        const next = clone(current);
        const habit = action.habitId ? findHabit(next, action.habitId) : null;
        next.announcement = "";

        switch (action.type) {
          case "TOGGLE_LAB": next.labOpen = !next.labOpen; return next;
          case "SET_GUIDE": next.guideScenario = action.scenario; return next;
          case "FAIL_NEXT": next.failNextSave = true; next.lastChange = "The next daily save will fail so rollback can be observed."; return next;
          case "DISMISS_ERROR": next.error = null; return next;
          case "CLEAR_ANNOUNCEMENT": next.announcement = ""; return next;
          case "START_TODAY_SAVE": {
            if (!habit || next.pendingSaves[habit.id]) return current;
            const before = isRecorded(habit, TODAY);
            habit.records[TODAY] = action.recorded;
            if (!action.recorded) delete habit.records[TODAY];
            const token = action.token;
            next.pendingSaves[habit.id] = { token, before, recorded: action.recorded, willFail: next.failNextSave };
            next.failNextSave = false;
            next.error = null;
            next.announcement = action.recorded ? (habit.type === "BUILD" ? "Done for today. Saving." : "Relapsed today. Saving.") : "Today’s record removed. Saving.";
            next.lastChange = `${habit.name} updated optimistically; the workspace is saving.`;
            return next;
          }
          case "SAVE_SUCCESS": {
            const pending = next.pendingSaves[action.habitId];
            if (!pending || pending.token !== action.token) return current;
            const savedHabit = findHabit(next, action.habitId);
            delete next.pendingSaves[action.habitId];
            next.announcement = "Saved.";
            next.lastChange = `${savedHabit.name} saved. Its position did not change.`;
            return next;
          }
          case "SAVE_FAILURE": {
            const pending = next.pendingSaves[action.habitId];
            if (!pending || pending.token !== action.token) return current;
            const failedHabit = findHabit(next, action.habitId);
            if (pending.before) failedHabit.records[TODAY] = true; else delete failedHabit.records[TODAY];
            delete next.pendingSaves[action.habitId];
            next.error = `We couldn’t save the change to “${failedHabit.name}”. The previous state has been restored. Try again.`;
            next.announcement = next.error;
            next.lastChange = `${failedHabit.name} rolled back to its authoritative previous state after a failed save.`;
            return next;
          }
          case "OPEN_DRAWER":
            if (!habit) return current;
            next.drawer = { habitId: habit.id, tab: action.tab || "overview", selectedDay: TODAY, olderDay: null };
            next.goalMenuId = null; next.addingGoal = false; next.renamingGoalId = null; next.deletingGoalId = null;
            next.lastChange = `Opened ${habit.name} without leaving Today.`;
            return next;
          case "CLOSE_DRAWER": next.drawer = null; next.lastChange = "Closed Habit details and returned to the unchanged Today workspace."; return next;
          case "SET_DRAWER_TAB": next.drawer.tab = action.tab; next.goalMenuId = null; next.addingGoal = false; next.renamingGoalId = null; next.deletingGoalId = null; return next;
          case "SELECT_RECENT_DAY": next.drawer.selectedDay = action.day; next.drawer.olderDay = null; next.lastChange = `Selected ${formatDate(action.day)}; no record changed.`; return next;
          case "SELECT_OLDER_DAY": next.drawer.olderDay = action.day; next.drawer.selectedDay = null; next.lastChange = `Selected older Tracking Day ${formatDate(action.day)}; no record changed.`; return next;
          case "SET_HISTORY_RECORDED": {

            if (!historyHabit || !eligible(historyHabit, action.day)) return current;
            if (action.recorded) historyHabit.records[action.day] = true; else delete historyHabit.records[action.day];
            next.announcement = action.recorded ? (historyHabit.type === "BUILD" ? "Completion added." : "Relapse added.") : (historyHabit.type === "BUILD" ? "Completion removed." : "Relapse removed.");
            next.lastChange = `${formatDate(action.day)} corrected with an explicit ${action.recorded ? "add" : "remove"} action.`;
            return next;
          }
          case "OPEN_CREATOR": next.creator = { step: 1, name: "", type: null, goals: [""], dirty: false }; next.discardCreatorConfirm = false; next.lastChange = "Opened the three-step Habit creation dialog."; return next;
          case "SET_CREATOR_NAME": next.creator.name = action.value; next.creator.dirty = next.creator.dirty || action.value.length > 0; return next;
          case "SET_CREATOR_TYPE": next.creator.type = action.value; next.creator.dirty = true; return next;
          case "SET_CREATOR_GOAL": next.creator.goals[action.index] = action.value; next.creator.dirty = next.creator.dirty || action.value.length > 0; return next;
          case "ADD_CREATOR_GOAL": next.creator.goals.push(""); next.creator.dirty = true; return next;
          case "CREATOR_STEP": next.creator.step = action.step; return next;

            if (next.creator?.dirty) next.discardCreatorConfirm = true; else next.creator = null;
            return next;
          case "KEEP_EDITING": next.discardCreatorConfirm = false; return next;
          case "DISCARD_CREATOR": next.creator = null; next.discardCreatorConfirm = false; next.lastChange = "Discarded the new Habit draft; Today remained unchanged."; return next;
          case "CREATE_HABIT": {
            const draft = next.creator;
            if (!draft?.name.trim() || !draft.type) return current;
            next.idCounter += 1;
            const newHabit = { id: `habit-${next.idCounter}`, name: draft.name.trim(), type: draft.type, startDate: TODAY, createdOrder: Math.max(0, ...next.habits.map((item) => item.createdOrder)) + 1, goals: draft.goals.map((name, index) => name.trim() ? { id: `goal-${next.idCounter}-${index}`, name: name.trim() } : null).filter(Boolean), records: {} };
            next.habits.push(newHabit);
            next.creator = null; next.discardCreatorConfirm = false; next.preset = "custom";
            next.announcement = `${newHabit.name} created.`;
            next.lastChange = `${newHabit.name} was created once, from the final step, with ${newHabit.goals.length} attached Goal${newHabit.goals.length === 1 ? "" : "s"}.`;
            return next;
          }
          case "TOGGLE_GOAL_MENU": next.goalMenuId = next.goalMenuId === action.goalId ? null : action.goalId; return next;
          case "START_ADD_GOAL": next.addingGoal = true; next.goalMenuId = null; return next;
          case "CANCEL_ADD_GOAL": next.addingGoal = false; return next;
          case "ADD_GOAL": {
            if (!habit || !action.name.trim()) return current;
            next.idCounter += 1; habit.goals.push({ id: `goal-${next.idCounter}`, name: action.name.trim() }); next.addingGoal = false;
            next.lastChange = `Added a Goal to ${habit.name}; its Habit attachment is fixed.`; return next;
          }

          case "RENAME_GOAL": {
            const goal = habit?.goals.find((item) => item.id === action.goalId);

            goal.name = action.name.trim(); next.renamingGoalId = null; next.lastChange = "Renamed the Goal without changing its Habit attachment."; return next;
          }
          case "START_DELETE_GOAL": next.deletingGoalId = action.goalId; next.goalMenuId = null; return next;
          case "CANCEL_DELETE_GOAL": next.deletingGoalId = null; return next;
          case "DELETE_GOAL": habit.goals = habit.goals.filter((item) => item.id !== action.goalId); next.deletingGoalId = null; next.lastChange = "Deleted the Goal without deleting its Habit or tracking history."; return next;
          case "RENAME_HABIT": if (habit && action.name.trim()) { habit.name = action.name.trim(); next.lastChange = "Renamed the Habit without changing its direction or history."; } return next;
          case "REQUEST_DELETE_HABIT": next.deleteHabitConfirm = action.habitId; return next;
          case "CANCEL_DELETE_HABIT": next.deleteHabitConfirm = null; return next;
          case "DELETE_HABIT": {
            const deleting = findHabit(next, action.habitId);
            next.habits = next.habits.filter((item) => item.id !== action.habitId); next.drawer = null; next.deleteHabitConfirm = null;
            next.lastChange = `Deleted ${deleting.name}, its Goals, and its tracking history.`; return next;
          }
          default: return current;
        }
      }

      return { TODAY, WEEKDAY, addDays, compare, formatDate, mondayOf, range, trackingState, streak, weekDays, weeklySummary, preset, reducer, findHabit };
    })();

    let state = HabitModel.preset("populated");
    const app = document.getElementById("app");

    const esc = (value) => String(value ?? "").replace(/[&<>'"]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" })[char]);
    const iconPaths = {
      sprout: '<path d="M12 21v-9"/><path d="M12 14c-4 0-7-2.2-7-6 4 0 7 2.2 7 6Z"/><path d="M12 11c0-4 2.5-7 7-7 0 4-2.5 7-7 7Z"/>',

    const icon = (name, small = false) => `<svg class="icon${small ? " icon-sm" : ""}" viewBox="0 0 24 24" aria-hidden="true" focusable="false">${iconPaths[name]}</svg>`;

    function dispatch(action, options = {}) {

    function overviewTab(habit) {
      const sevenDayStart = HabitModel.addDays(state.today, -6);

      return `<section class="drawer-section"><div class="streak-feature"><span class="feature-icon">${icon("streak")}</span><div><strong>${HabitModel.streak(habit)} ${HabitModel.streak(habit) === 1 ? "day" : "days"}</strong><span>Current ${habit.type === "BUILD" ? "Build Streak" : "Clean Streak"}</span></div></div></section>
        ${summaryMarkup}
        <section class="drawer-section"><h3>Recent Tracking Days</h3><p class="muted">Choose a day to review it. Selecting a day never changes its record.</p><div class="legend">${[...(habit.type === "BUILD" ? ["completion", "missed", "pending"] : ["clean", "relapse"]), "ineligible"].map((status) => `<span>${dayMark(status)} ${stateLabels[status]}</span>`).join("")}</div><div class="recent-strip">${recentDays.map((day) => { const status = HabitModel.trackingState(habit, day); const d = new Date(`${day}T12:00:00Z`); return `<button class="recent-day" data-action="select-recent" data-day="${day}" aria-pressed="${selectedDay === day}" aria-label="${HabitModel.formatDate(day)}: ${stateLabels[status]}"><span class="dow">${HabitModel.WEEKDAY[d.getUTCDay()]}</span><span class="num">${d.getUTCDate()}</span><span class="state-mini">${icon(stateIcons[status], true)} ${stateLabels[status]}</span></button>`; }).join("")}</div>${selectedDayEditor(habit, selectedDay)}
        <details class="older-editor"><summary>${icon("calendar", true)} Edit older history</summary>${hasOlder ? `<div class="older-fields"><label><span class="field-label">Tracking Day</span><input class="field" type="date" data-action="older-date" min="${habit.startDate}" max="${olderMax}" value="${state.drawer.olderDay || olderMax}"></label><span class="helper">From ${esc(HabitModel.formatDate(habit.startDate, { weekday: undefined }))} through ${esc(HabitModel.formatDate(olderMax, { weekday: undefined }))}</span></div>${selectedDayEditor(habit, state.drawer.olderDay || olderMax)}` : '<p class="helper">There are no older eligible Tracking Days for this Habit yet.</p>'}</details></section>`;
    }

    function goalsTab(habit) {
      const goalRows = habit.goals.length ? habit.goals.map((goal) => {
        if (state.renamingGoalId === goal.id) return `<form class="inline-form" data-form="rename-goal" data-habit-id="${habit.id}" data-goal-id="${goal.id}"><label><span class="sr-only">Goal name</span><input id="rename-goal-name" class="field" name="name" value="${esc(goal.name)}" maxlength="120" required></label><div><button class="button primary" type="submit">Save</button><button class="button quiet" type="button" data-action="cancel-rename-goal">Cancel</button></div></form>`;
        return `<div class="goal-row"><span class="goal-name">${icon("goal", true)} ${esc(goal.name)}</span><button class="button icon-button quiet" data-action="toggle-goal-menu" data-goal-id="${goal.id}" aria-label="Actions for Goal ${esc(goal.name)}" aria-expanded="${state.goalMenuId === goal.id}" title="Goal actions">${icon("more")}</button>${state.goalMenuId === goal.id ? `<div class="goal-menu"><button data-action="start-rename-goal" data-goal-id="${goal.id}">Rename</button><button class="delete" data-action="start-delete-goal" data-goal-id="${goal.id}">Delete</button></div>` : ""}</div>`;
      }).join("") : '<div class="column-empty"><h3>No Goals attached</h3><p>Goals are optional named intentions. They do not track progress.</p></div>';
      const add = state.addingGoal ? `<form class="inline-form" data-form="add-goal" data-habit-id="${habit.id}"><label><span class="field-label">Goal name</span><input id="new-goal-name" class="field" name="name" maxlength="120" required></label><div><button class="button primary" type="submit">Add Goal</button><button class="button quiet" type="button" data-action="cancel-add-goal">Cancel</button></div></form>` : "";
      const deleting = habit.goals.find((goal) => goal.id === state.deletingGoalId);
      const confirm = deleting ? `<div class="inline-confirm" role="alertdialog" aria-labelledby="delete-goal-title"><strong id="delete-goal-title">Delete “${esc(deleting.name)}”?</strong><p class="helper">The Habit and its tracking history will stay unchanged.</p><div class="button-row"><button class="button secondary" data-action="cancel-delete-goal">Cancel</button><button class="button danger" data-action="delete-goal" data-habit-id="${habit.id}" data-goal-id="${deleting.id}">Delete Goal</button></div></div>` : "";
      return `<section class="drawer-section"><div class="tab-heading"><div><h3>Goals</h3><p class="helper">Named intentions attached to this Habit. Their attachment cannot be changed.</p></div><button class="button icon-button quiet" data-action="start-add-goal" aria-label="Add a Goal" title="Add a Goal">${icon("plus")}</button></div><div class="goal-list">${goalRows}</div>${add}${confirm}</section>`;
    }

    function settingsTab(habit) {
      return `<section class="drawer-section"><h3>Rename Habit</h3><form class="settings-form" data-form="rename-habit" data-habit-id="${habit.id}"><label><span class="field-label">Habit name</span><input class="field" name="name" value="${esc(habit.name)}" maxlength="120" required></label><p class="helper">Its ${habit.type === "BUILD" ? "Build" : "Break"} direction and creation day cannot be changed.</p><div><button class="button primary" type="submit">Save name</button></div></form></section><section class="drawer-section danger-zone"><h3>Delete Habit</h3><p>Delete this Habit, its attached Goals, and all of its tracking history.</p><button class="button danger-outline" data-action="request-delete-habit" data-habit-id="${habit.id}">${icon("trash", true)} Delete Habit</button></section>`;
    }

    function drawer() {
      if (!state.drawer) return "";
      const habit = HabitModel.findHabit(state, state.drawer.habitId);
      if (!habit) return "";
      const tabContent = state.drawer.tab === "overview" ? overviewTab(habit) : state.drawer.tab === "goals" ? goalsTab(habit) : settingsTab(habit);
      return `<button class="scrim" data-action="close-drawer" aria-label="Close Habit details"></button><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title"><header class="drawer-header"><div><p class="eyebrow">${habit.type === "BUILD" ? "Build Habit" : "Break Habit"}</p><h2 id="drawer-title">${esc(habit.name)}</h2><p class="helper">Began ${esc(HabitModel.formatDate(habit.startDate, { weekday: undefined }))}</p></div><button class="button icon-button quiet drawer-close" data-action="close-drawer" aria-label="Close Habit details">${icon("close")}</button></header><div class="drawer-tabs" role="tablist" aria-label="Habit details"><button class="drawer-tab" role="tab" aria-selected="${state.drawer.tab === "overview"}" data-action="drawer-tab" data-tab="overview">Overview</button><button class="drawer-tab" role="tab" aria-selected="${state.drawer.tab === "goals"}" data-action="drawer-tab" data-tab="goals">Goals</button><button class="drawer-tab" role="tab" aria-selected="${state.drawer.tab === "settings"}" data-action="drawer-tab" data-tab="settings">Settings</button></div><div class="drawer-body">${tabContent}</div></aside>`;
    }

    function creatorDialog() {
      if (!state.creator) return "";
      const c = state.creator;
      const stepTitle = c.step === 1 ? "What behaviour do you want to shape?" : c.step === 2 ? "Which direction fits?" : "Add optional Goals";
      let body;
      if (c.step === 1) body = `<p class="wizard-copy">Use a short phrase that will be easy to scan each day.</p><label><span class="field-label">Habit name</span><input id="habit-name" class="field" data-creator-input="name" value="${esc(c.name)}" maxlength="120" placeholder="For example, Walk after dinner" autocomplete="off"></label>`;
      else if (c.step === 2) body = `<p class="wizard-copy">Build is something you want to perform. Break is something you want to avoid. This choice cannot be changed later.</p><div class="direction-choices"><button class="direction-choice" data-action="creator-type" data-type="BUILD" aria-pressed="${c.type === "BUILD"}"><strong>${icon("sprout")} Build</strong><span>Record a Completion when you perform this behaviour.</span></button><button class="direction-choice" data-action="creator-type" data-type="BREAK" aria-pressed="${c.type === "BREAK"}"><strong>${icon("shield")} Break</strong><span>Clean Days happen automatically unless you record a Relapse.</span></button></div>`;
      else body = `<p class="wizard-copy">Goals are named intentions attached to this Habit—not tasks or progress trackers. They are optional and can be added later.</p><div class="goal-drafts">${c.goals.map((goal, index) => `<label><span class="field-label">${index === 0 ? "Goal name (optional)" : `Another Goal (optional)`}</span><input class="field" data-creator-goal="${index}" value="${esc(goal)}" maxlength="120" placeholder="For example, Make evenings feel calmer"></label>`).join("")}</div><button class="button quiet" data-action="add-creator-goal">${icon("plus", true)} Add another</button>`;
      const canNext = c.step === 1 ? c.name.trim() : c.step === 2 ? c.type : true;
      return `<div class="modal-wrap" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="creator-title"><header class="modal-header"><div><p class="eyebrow">Step ${c.step} of 3</p><h2 id="creator-title">${stepTitle}</h2></div><button class="button icon-button quiet" data-action="close-creator" aria-label="Close new Habit dialog">${icon("close")}</button></header><div class="modal-body"><div class="steps" aria-label="Creation progress"><div class="step ${c.step >= 1 ? c.step === 1 ? "current" : "complete" : ""}">1 · Name</div><div class="step ${c.step >= 2 ? c.step === 2 ? "current" : "complete" : ""}">2 · Direction</div><div class="step ${c.step === 3 ? "current" : ""}">3 · Goals</div></div>${body}<div class="wizard-actions"><div>${c.step > 1 ? `<button class="button secondary" data-action="creator-back">${icon("back", true)} Back</button>` : ""}</div><div class="wizard-actions-right"><button class="button quiet" data-action="close-creator">Cancel</button>${c.step < 3 ? `<button class="button primary" data-action="creator-next" ${canNext ? "" : "disabled"}>Continue</button>` : `<button class="button primary" data-action="create-habit">Create Habit</button>`}</div></div></div></section></div>`;
    }

    function confirmations() {
      if (state.discardCreatorConfirm) return `<div class="modal-wrap confirm-wrap"><section class="modal confirm-modal" role="alertdialog" aria-modal="true" aria-labelledby="discard-title"><div class="modal-body"><h2 id="discard-title">Discard new Habit?</h2><p>Your draft values will be lost. Today will remain unchanged.</p><div class="button-row"><button class="button secondary keep-editing" data-action="keep-editing">Keep editing</button><button class="button danger" data-action="discard-creator">Discard</button></div></div></section></div>`;
      if (state.deleteHabitConfirm) {
        const habit = HabitModel.findHabit(state, state.deleteHabitConfirm);
        return `<div class="modal-wrap confirm-wrap"><section class="modal confirm-modal" role="alertdialog" aria-modal="true" aria-labelledby="delete-habit-title"><div class="modal-body"><h2 id="delete-habit-title">Delete “${esc(habit.name)}”?</h2><p>This permanently deletes the Habit, its ${habit.goals.length} attached Goal${habit.goals.length === 1 ? "" : "s"}, and all Completion or Relapse history.</p><div class="button-row"><button class="button secondary delete-habit-cancel" data-action="cancel-delete-habit">Cancel</button><button class="button danger" data-action="delete-habit" data-habit-id="${habit.id}">Delete Habit</button></div></div></section></div>`;
      }
      return "";
    }

    const scenarios = {
      daily: { name: "Daily rhythm", description: "Watch optimistic feedback, stable order, persistent Undo, and rollback after a failed save.", steps: [
        ["Reset populated", { type: "LOAD_PRESET", preset: "populated", message: "Daily rhythm: ready to scan both stable columns." }],
        ["Complete reading", { type: "START_TODAY_SAVE", habitId: "build-read", recorded: true }],
        ["Mark next save to fail", { type: "FAIL_NEXT" }],
        ["Record a Relapse", { type: "START_TODAY_SAVE", habitId: "break-scroll", recorded: true }],
        ["Undo reading", { type: "START_TODAY_SAVE", habitId: "build-read", recorded: false }],
      ] },
      history: { name: "History correction", description: "Open Overview, select without mutating, then use explicit recent and older correction actions.", steps: [
        ["Open reading Overview", { type: "OPEN_DRAWER", habitId: "build-read", tab: "overview" }],
        ["Select 30 August", { type: "SELECT_RECENT_DAY", day: "2026-08-30" }],
        ["Remove its Completion", { type: "SET_HISTORY_RECORDED", habitId: "build-read", day: "2026-08-30", recorded: false }],
        ["Select older 22 August", { type: "SELECT_OLDER_DAY", day: "2026-08-22" }],
        ["Remove older Completion", { type: "SET_HISTORY_RECORDED", habitId: "build-read", day: "2026-08-22", recorded: false }],
      ] },
      goals: { name: "Goals", description: "Manage named intentions in the drawer. No step offers Goal reassignment.", steps: [
        ["Open Stretch Goals", { type: "OPEN_DRAWER", habitId: "build-stretch", tab: "goals" }],
        ["Add a Goal", { type: "ADD_GOAL", habitId: "build-stretch", name: "Feel ready for weekend walks" }],
        ["Rename first Goal", { type: "RENAME_GOAL", habitId: "build-stretch", goalId: "goal-mobility", name: "Move comfortably every day" }],
        ["Delete second Goal", { type: "DELETE_GOAL", habitId: "build-stretch", goalId: "goal-break" }],
      ] },
      create: { name: "Creation", description: "Move through three focused steps. The draft survives Back; creation happens only at the end.", steps: [
        ["Start from empty", { type: "LOAD_PRESET", preset: "empty", message: "Creation walkthrough begins in the zero-Habit state." }],
        ["Open creator", { type: "OPEN_CREATOR" }],
        ["Name the behaviour", { type: "SET_CREATOR_NAME", value: "Walk after dinner" }],
        ["Go to direction", { type: "CREATOR_STEP", step: 2 }],
        ["Choose Build", { type: "SET_CREATOR_TYPE", value: "BUILD" }],
        ["Go to Goals", { type: "CREATOR_STEP", step: 3 }],
        ["Add optional Goal", { type: "SET_CREATOR_GOAL", index: 0, value: "Create a gentle evening transition" }],
        ["Create once", { type: "CREATE_HABIT" }],
      ] },
      empty: { name: "Empty states", description: "Compare zero Habits, a one-direction collection, and the populated two-column workspace.", steps: [
        ["Show zero Habits", { type: "LOAD_PRESET", preset: "empty" }],
        ["Show Build only", { type: "LOAD_PRESET", preset: "build-only" }],
        ["Show both directions", { type: "LOAD_PRESET", preset: "populated" }],
        ["Open adaptive drawer", { type: "OPEN_DRAWER", habitId: "build-read", tab: "overview" }],
      ] },
    };

    function lab() {
      const scenario = scenarios[state.guideScenario];
      const drawerHabit = state.drawer ? HabitModel.findHabit(state, state.drawer.habitId) : null;
      const todayOutcomes = state.habits.map((habit) => `${habit.name}: ${stateLabels[HabitModel.trackingState(habit, state.today)]}`).join("; ") || "No Habits";
      const orderedHabits = state.habits.map((habit) => `${habit.type === "BUILD" ? "Build" : "Break"}: ${habit.name}`).join("; ") || "None";
      const selectedTrackingDay = drawerHabit && (state.drawer.selectedDay || state.drawer.olderDay) ? `${state.drawer.selectedDay || state.drawer.olderDay}: ${stateLabels[HabitModel.trackingState(drawerHabit, state.drawer.selectedDay || state.drawer.olderDay)]}` : "None";
      const creatorDraft = state.creator ? `${state.creator.name || "Unnamed"} · ${state.creator.type || "No direction"} · ${state.creator.goals.filter(Boolean).length} Goals · ${state.creator.dirty ? "changed" : "untouched"}` : "None";
      return `<aside class="lab" aria-label="Prototype evaluator controls"><div class="lab-shell"><div class="lab-summary"><div class="lab-title"><span class="lab-badge">Throwaway prototype</span><p><strong>Question:</strong> Does the resolved Today experience stay understandable across daily states, corrections, Goals, creation, and empty states?</p></div><button class="button lab-toggle" data-action="toggle-lab" aria-expanded="${state.labOpen}">${state.labOpen ? "Hide test guide" : "Open test guide"}</button></div>${state.labOpen ? `<div class="lab-content"><section class="lab-panel"><h2>Guided walkthroughs</h2><p>${scenario.description}</p><div class="scenario-tabs" role="tablist" aria-label="Prototype scenarios">${Object.entries(scenarios).map(([key, value]) => `<button class="scenario-tab" role="tab" aria-selected="${state.guideScenario === key}" data-action="guide-scenario" data-scenario="${key}">${value.name}</button>`).join("")}</div><div class="guide-steps">${scenario.steps.map(([label, action], index) => `<div class="guide-step"><span class="step-number">${index + 1}</span><p>${esc(label)}</p><button class="button small" data-action="guide-step" data-payload="${esc(JSON.stringify(action))}">Apply</button></div>`).join("")}</div></section><section class="lab-panel"><h2>Current prototype state</h2><p>The full interaction state updates after every action.</p><dl class="state-list"><dt>Preset</dt><dd>${esc(state.preset)}</dd><dt>Ordered Habits</dt><dd>${esc(orderedHabits)}</dd><dt>Today outcomes</dt><dd>${esc(todayOutcomes)}</dd><dt>Open layer</dt><dd>${drawerHabit ? `${esc(drawerHabit.name)} · ${esc(state.drawer.tab)}` : state.creator ? `New Habit · step ${state.creator.step}` : "None"}</dd><dt>Selected day</dt><dd>${esc(selectedTrackingDay)}</dd><dt>Creation draft</dt><dd>${esc(creatorDraft)}</dd><dt>Saving</dt><dd>${Object.keys(state.pendingSaves).length ? Object.keys(state.pendingSaves).join(", ") : "Nothing"}${state.failNextSave ? " · next save will fail" : ""}</dd><dt>Last change</dt><dd>${esc(state.lastChange)}</dd></dl><h3 style="margin:16px 0 4px;font-size:16px">Free play</h3><div class="free-play"><button class="button small" data-action="preset" data-preset="populated">Populated</button><button class="button small" data-action="preset" data-preset="empty">Empty</button><button class="button small" data-action="preset" data-preset="build-only">Build only</button><button class="button small" data-action="fail-next">Fail next save</button><button class="button small" data-action="open-creator">Open creator</button></div></section></div>` : ""}</div></aside>`;
    }

    function render() {
      app.innerHTML = `${lab()}<main class="app-shell"><header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true">HS</span><span>Habit Shaper</span></div><div class="utility"><span>${esc(state.userEmail)}</span><button class="signout" type="button">Sign out</button></div></header><section class="today-header" aria-labelledby="today-title"><div><p class="eyebrow">Your private record</p><h1 id="today-title">Today</h1><p class="date">${esc(HabitModel.formatDate(state.today))}</p><p class="tagline">Shape one day at a time</p></div><button class="button secondary" data-action="open-creator">${icon("plus")} Add a Habit</button></section>${workspace()}</main>${drawer()}${creatorDialog()}${confirmations()}${state.announcement ? `<div class="live-region" role="status" aria-live="polite">${esc(state.announcement)}</div>` : '<div class="sr-only" role="status" aria-live="polite"></div>'}`;
    }

    app.addEventListener("click", (event) => {
      const target = event.target.closest("[data-action]");
      if (!target || target.disabled) return;
      const action = target.dataset.action;
      if (action === "toggle-lab") dispatch({ type: "TOGGLE_LAB" });
      else if (action === "guide-scenario") dispatch({ type: "SET_GUIDE", scenario: target.dataset.scenario });
      else if (action === "guide-step") dispatch(JSON.parse(target.dataset.payload));
      else if (action === "preset") dispatch({ type: "LOAD_PRESET", preset: target.dataset.preset });
      else if (action === "fail-next") dispatch({ type: "FAIL_NEXT" });
      else if (action === "dismiss-error") dispatch({ type: "DISMISS_ERROR" });
      else if (action === "today") dispatch({ type: "START_TODAY_SAVE", habitId: target.dataset.habitId, recorded: target.dataset.recorded === "true" });
      else if (action === "open-drawer") dispatch({ type: "OPEN_DRAWER", habitId: target.dataset.habitId });
      else if (action === "close-drawer") dispatch({ type: "CLOSE_DRAWER", returnHabitId: state.drawer?.habitId });
      else if (action === "drawer-tab") dispatch({ type: "SET_DRAWER_TAB", tab: target.dataset.tab });
      else if (action === "select-recent") dispatch({ type: "SELECT_RECENT_DAY", day: target.dataset.day });
      else if (action === "history-record") dispatch({ type: "SET_HISTORY_RECORDED", habitId: target.dataset.habitId, day: target.dataset.day, recorded: target.dataset.recorded === "true" });
      else if (action === "open-creator") dispatch({ type: "OPEN_CREATOR" });
      else if (action === "close-creator") dispatch({ type: "REQUEST_CLOSE_CREATOR" });
      else if (action === "creator-type") dispatch({ type: "SET_CREATOR_TYPE", value: target.dataset.type });
      else if (action === "creator-next") dispatch({ type: "CREATOR_STEP", step: state.creator.step + 1 });
      else if (action === "creator-back") dispatch({ type: "CREATOR_STEP", step: state.creator.step - 1 });
      else if (action === "add-creator-goal") dispatch({ type: "ADD_CREATOR_GOAL" });
      else if (action === "create-habit") dispatch({ type: "CREATE_HABIT" });
      else if (action === "keep-editing") dispatch({ type: "KEEP_EDITING" });
      else if (action === "discard-creator") dispatch({ type: "DISCARD_CREATOR" });
      else if (action === "toggle-goal-menu") dispatch({ type: "TOGGLE_GOAL_MENU", goalId: target.dataset.goalId });
      else if (action === "start-add-goal") dispatch({ type: "START_ADD_GOAL" });
      else if (action === "cancel-add-goal") dispatch({ type: "CANCEL_ADD_GOAL" });
      else if (action === "start-rename-goal") dispatch({ type: "START_RENAME_GOAL", goalId: target.dataset.goalId });
      else if (action === "cancel-rename-goal") dispatch({ type: "CANCEL_RENAME_GOAL" });
      else if (action === "start-delete-goal") dispatch({ type: "START_DELETE_GOAL", goalId: target.dataset.goalId });
      else if (action === "cancel-delete-goal") dispatch({ type: "CANCEL_DELETE_GOAL" });
      else if (action === "delete-goal") dispatch({ type: "DELETE_GOAL", habitId: target.dataset.habitId, goalId: target.dataset.goalId });
      else if (action === "request-delete-habit") dispatch({ type: "REQUEST_DELETE_HABIT", habitId: target.dataset.habitId });
      else if (action === "cancel-delete-habit") dispatch({ type: "CANCEL_DELETE_HABIT" });
      else if (action === "delete-habit") dispatch({ type: "DELETE_HABIT", habitId: target.dataset.habitId });
    });

    app.addEventListener("input", (event) => {
      const target = event.target;
      if (target.matches("[data-creator-input='name']")) {
        dispatch({ type: "SET_CREATOR_NAME", value: target.value }, { render: false });
        const continueButton = document.querySelector("[data-action='creator-next']");
        if (continueButton) continueButton.disabled = !state.creator.name.trim();
      }
      if (target.matches("[data-creator-goal]")) dispatch({ type: "SET_CREATOR_GOAL", index: Number(target.dataset.creatorGoal), value: target.value }, { render: false });
    });

    app.addEventListener("change", (event) => {
      const target = event.target;
      if (target.matches("[data-action='older-date']")) dispatch({ type: "SELECT_OLDER_DAY", day: target.value });
    });

    app.addEventListener("submit", (event) => {
      event.preventDefault();
      const form = event.target;
      const data = new FormData(form);
      if (form.dataset.form === "add-goal") dispatch({ type: "ADD_GOAL", habitId: form.dataset.habitId, name: data.get("name") });
      else if (form.dataset.form === "rename-goal") dispatch({ type: "RENAME_GOAL", habitId: form.dataset.habitId, goalId: form.dataset.goalId, name: data.get("name") });
      else if (form.dataset.form === "rename-habit") dispatch({ type: "RENAME_HABIT", habitId: form.dataset.habitId, name: data.get("name") });
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Tab") {
        const layers = [...document.querySelectorAll(".drawer, .modal")];
        const layer = layers.at(-1);
        if (!layer) return;
        const focusable = [...layer.querySelectorAll('button:not([disabled]), input:not([disabled]), select:not([disabled]), summary, [href], [tabindex]:not([tabindex="-1"])')];
        if (!focusable.length) return;
        const first = focusable[0];
        const last = focusable.at(-1);
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
        return;
      }
      if (event.key !== "Escape") return;
      if (state.discardCreatorConfirm) dispatch({ type: "KEEP_EDITING" });
      else if (state.deleteHabitConfirm) dispatch({ type: "CANCEL_DELETE_HABIT" });
      else if (state.goalMenuId) dispatch({ type: "TOGGLE_GOAL_MENU", goalId: state.goalMenuId });
      else if (state.creator) dispatch({ type: "REQUEST_CLOSE_CREATOR" });
      else if (state.drawer) dispatch({ type: "CLOSE_DRAWER", returnHabitId: state.drawer.habitId });
    });

    render();
  </script>
</body>
</html>
