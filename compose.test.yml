services:
  migrate:
    command:
      - sh
      - -c
      - npm run prisma:migrate && touch /tmp/migrated && exec tail -f /dev/null
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/migrated"]
      interval: 2s
      timeout: 2s
      retries: 30

  app:
    profiles: ["production-app"]

  test:
    build:
      context: .
      target: test-runner
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:?Set MYSQL_USER in .env.test}:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env.test}@db:3306/${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env.test}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env.test}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL in .env.test}
    depends_on:
      migrate:
        condition: service_healthy
    init: true
